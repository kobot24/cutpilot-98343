name: 'Build and Release'

on:
  push:
    branches:
      - 'claude/embed-ghostscript-binary-KXTSr'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=v1.0.0" >> $GITHUB_ENV
          fi

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            // Check if release already exists
            try {
              const { data: existingRelease } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.VERSION
              });
              console.log('Release already exists, using existing release ID');
              return existingRelease.id;
            } catch (error) {
              if (error.status === 404) {
                console.log('Release does not exist, creating new release');
              } else {
                throw error;
              }
            }

            // Create new release
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.VERSION,
              name: `CutPilot ${process.env.VERSION}`,
              body: `## CutPilot ${process.env.VERSION}

              ### Features
              - PDF Cut Contour Creation
              - Professional CMYK Conversion with Ghostscript
              - ICC Profile Support
              - Spot Color Preservation
              - Batch Processing

              ### Downloads
              - **macOS**: Download the .dmg file
              - **Windows**: Download the .exe installer
              - **Linux**: Download the .AppImage or .deb file

              ### Installation
              1. Download the appropriate file for your platform
              2. Install/run the application
              3. No additional dependencies required!

              ### Notes
              - Ghostscript is embedded in the application
              - All ICC profiles are included
              - No manual setup required`,
              draft: false,
              prerelease: false,
            });
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf ghostscript

      - name: Install Ghostscript (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ghostscript

      - name: Install Ghostscript (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install ghostscript -y
          echo "C:\Program Files\gs\gs10.03.1\bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false
            })
