name: Build CutPilot Installers

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            name: macOS (Intel)
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            name: macOS (Apple Silicon)
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            name: Windows (x64)

    runs-on: ${{ matrix.platform.os }}
    name: Build for ${{ matrix.platform.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'CutPilot v__VERSION__'
          releaseBody: |
            ## CutPilot Desktop App

            ### Features
            - PDF Cut Contour Tool für professionelle Druckereien
            - Native Desktop-Integration für Mac und Windows
            - Direkter Dateisystem-Zugriff
            - Schneller PDF-Export mit ICC-Profil-Unterstützung

            ### Installation
            - **macOS**: Laden Sie die `.dmg` Datei herunter, öffnen Sie sie und ziehen Sie CutPilot in den Programme-Ordner
            - **Windows**: Laden Sie die `.msi` oder `.exe` Datei herunter und führen Sie den Installer aus

            ### Changelog
            See commit history for detailed changes.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.rust_target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cutpilot-${{ matrix.platform.rust_target }}
          path: |
            src-tauri/target/${{ matrix.platform.rust_target }}/release/bundle/**/*
          retention-days: 30
